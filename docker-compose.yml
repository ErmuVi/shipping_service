version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shipping_postgres_db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    container_name: sphipping_redis
    ports:
      - "6379:6379"
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: shipping_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  postgres_data:
  qdrant_data:
