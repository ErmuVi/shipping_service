[project]
name = "shipping-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Viktor"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "celery (>=5.6.3,<6.0.0)",
    "qdrant-client (>=1.19.1,<2.0.0)",
    "fastembed (>=0.8.1,<0.9.0)",
    "langchain-core (>=1.6.6,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "openai (>=3.22.1,<4.0.0)",
    "streamlit (>=1.64.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.ruff]

line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]